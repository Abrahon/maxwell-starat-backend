name: Django CI/CD Pipeline (Auto Deploy Simulation)

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-app:latest .

      # 5. Push image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/django-app:latest

      # 6. SIMULATED DEPLOY (THIS IS THE KEY PART)
      - name: Pull image (simulate server pull)
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/django-app:latest

      - name: Run container (simulate deployment)
        run: |
          docker run -d --name django-test -p 8000:8000 \
            ${{ secrets.DOCKER_USERNAME }}/django-app:latest

      # 7. Wait for startup
      - name: Wait for app startup
        run: sleep 10

      # 8. Check running container
      - name: Check container logs
        run: docker logs django-test

      # 9. Stop container (cleanup)
      - name: Stop container
        run: |
          docker stop django-test
          docker rm django-test

      # 10. Final status
      - name: Deployment Success
        run: echo "🚀 Simulated deployment completed successfully"