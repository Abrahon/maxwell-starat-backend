name: Django CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (recommended for modern builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker image (latest)
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-app:latest .

      # 5. Tag image with commit SHA (versioned release)
      - name: Tag Docker image
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/django-app:latest \
                     ${{ secrets.DOCKER_USERNAME }}/django-app:${{ github.sha }}

      # 6. Push latest image
      - name: Push latest image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/django-app:latest

      # 7. Push versioned image
      - name: Push versioned image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/django-app:${{ github.sha }}

      # 8. Final confirmation step
      - name: Simulated Deploy
        run: echo "✅ Image successfully built and pushed to Docker Hub"