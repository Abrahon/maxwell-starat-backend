name: Django CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and tag image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-app:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/django-app:latest \
                     ${{ secrets.DOCKER_USERNAME }}/django-app:${{ github.sha }}

      - name: Push Docker image (latest)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/django-app:latest

      - name: Push Docker image (versioned)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/django-app:${{ github.sha }}

      - name: Simulated Deploy
        run: echo "Image pushed successfully 🚀"